name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  images:
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binary:
          - vpn-api
          - vpn-telegram-bot
          - vpn-billing-worker
          - vpn-provisioning-worker
          - vpn-notification-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BINARY=${{ matrix.binary }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vpn-bot-v2-${{ matrix.binary }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/vpn-bot-v2-${{ matrix.binary }}:latest

  web-images:
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin-web
            context: web/admin
          - name: mini-app-web
            context: web/mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vpn-bot-v2-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/vpn-bot-v2-${{ matrix.name }}:latest
