name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-bot-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, mini-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - run: npm run build
        working-directory: web/${{ matrix.app }}

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vpn_bot
          POSTGRES_USER: vpn_bot
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn_bot -d vpn_bot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply baseline and migrations
        env:
          PGPASSWORD: ci-password
        run: |
          psql=(psql -h 127.0.0.1 -U vpn_bot -d vpn_bot -v ON_ERROR_STOP=1)
          "${psql[@]}" < deploy/db/init/001_baseline.sql
          for migration in deploy/db/migrations/*.sql; do
            "${psql[@]}" < "$migration"
          done

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  delivery-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: |
          bash -n deploy/*.sh tests/pull-release.sh setup.sh
          bash tests/pull-release.sh
      - name: Render immutable release Compose configuration
        run: |
          runtime_env=$(mktemp)
          trap 'rm -f "$runtime_env"' EXIT
          printf '%s\n' 'POSTGRES_PASSWORD=ci-password' \
            'APPLICATION_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' > "$runtime_env"
          VPN_BOT_RELEASE=0123456789abcdef0123456789abcdef01234567 \
            docker compose --env-file "$runtime_env" -f deploy/docker-compose.yml config --quiet

  images:
    needs: [rust, web, security, migrations, delivery-scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - vpn-api
          - vpn-telegram-bot
          - vpn-billing-worker
          - vpn-provisioning-worker
          - vpn-notification-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BINARY=${{ matrix.binary }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/zeragorn-ru/vpn-bot-v2-${{ matrix.binary }}:${{ github.sha }}

  web-images:
    needs: [rust, web, security, migrations, delivery-scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin-web
            context: web/admin
          - name: mini-app-web
            context: web/mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/zeragorn-ru/vpn-bot-v2-${{ matrix.name }}:${{ github.sha }}

  publish-test-release:
    needs: [rust, web, migrations, security, delivery-scripts, images, web-images]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.images.result == 'success' && needs.web-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish immutable pull-release descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          tag="test-$RELEASE_SHA"
          if target=$(gh release view "$tag" --repo "$REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            test "$target" = "$RELEASE_SHA" || {
              printf '%s\n' "existing release $tag targets a different commit" >&2
              exit 65
            }
            exit 0
          fi
          gh release create "$tag" --repo "$REPOSITORY" --target "$RELEASE_SHA" \
            --prerelease --title "Test release $RELEASE_SHA" \
            --notes "Validated SHA release for server-initiated pull deployment."
