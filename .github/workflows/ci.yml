name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA of an already published release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vpn-bot-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, mini-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - run: npm run build
        working-directory: web/${{ matrix.app }}

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vpn_bot
          POSTGRES_USER: vpn_bot
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn_bot -d vpn_bot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply baseline and migrations
        env:
          PGPASSWORD: ci-password
        run: |
          psql=(psql -h 127.0.0.1 -U vpn_bot -d vpn_bot -v ON_ERROR_STOP=1)
          "${psql[@]}" < deploy/db/init/001_baseline.sql
          for migration in deploy/db/migrations/*.sql; do
            "${psql[@]}" < "$migration"
          done

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [rust, web, security, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - vpn-api
          - vpn-telegram-bot
          - vpn-billing-worker
          - vpn-provisioning-worker
          - vpn-notification-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BINARY=${{ matrix.binary }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/zeragorn-ru/vpn-bot-v2-${{ matrix.binary }}:${{ github.sha }}

  web-images:
    needs: [rust, web, security, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin-web
            context: web/admin
          - name: mini-app-web
            context: web/mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/zeragorn-ru/vpn-bot-v2-${{ matrix.name }}:${{ github.sha }}

  deploy:
    needs: [rust, web, migrations, security, images, web-images]
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.images.result == 'success' && needs.web-images.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.rust.result == 'success' &&
          needs.web.result == 'success' && needs.migrations.result == 'success' &&
          needs.security.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: vpn-bot-v2-test-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select immutable release
        env:
          REQUESTED_RELEASE: ${{ inputs.release_sha }}
        run: |
          release="${REQUESTED_RELEASE:-$GITHUB_SHA}"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]] || {
            printf '%s\n' 'release SHA must be a full lowercase 40-character hash' >&2
            exit 64
          }
          printf 'RELEASE_SHA=%s\n' "$release" >> "$GITHUB_ENV"
      - name: Configure pinned SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_FINGERPRINT: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || exit 64
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]] || exit 64
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 64
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_SSH_PORT >= 1 && DEPLOY_SSH_PORT <= 65535 )) || exit 64
          [[ "$DEPLOY_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+=?$ ]] || exit 64
          [[ "$DEPLOY_SSH_HOST_KEY" =~ ^\[[A-Za-z0-9.:-]+\]:[0-9]{1,5}\ ssh-ed25519\ [A-Za-z0-9+/]+={0,2}$ ]] || exit 64
          host_key_fingerprint=$(printf '%s\n' "$DEPLOY_SSH_HOST_KEY" | ssh-keygen -lf - | awk '{print $2}')
          test "$host_key_fingerprint" = "$DEPLOY_SSH_FINGERPRINT"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Upload managed deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -o pipefail
          ssh_options=(-i ~/.ssh/id_ed25519 -p "$DEPLOY_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes
            -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=10
            -o ServerAliveCountMax=3 -o ControlMaster=auto
            -o "ControlPath=$RUNNER_TEMP/vpn-bot-ssh-%C" -o ControlPersist=120)
          ssh_retry() {
            local attempt
            for attempt in 1 2 3; do
              if ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$@"; then
                return 0
              fi
              [ "$attempt" -eq 3 ] || sleep "$((attempt * 5))"
            done
            return 1
          }
          upload_retry() {
            local attempt
            for attempt in 1 2 3; do
              if tar --create --gzip --file - deploy | \
                ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                  "tar --extract --gzip --file - -C '$DEPLOY_PATH'"; then
                return 0
              fi
              [ "$attempt" -eq 3 ] || sleep "$((attempt * 5))"
            done
            return 1
          }
          ssh_retry "install -d -m 0750 '$DEPLOY_PATH/deploy'"
          upload_retry
      - name: Apply immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          ssh_options=(-i ~/.ssh/id_ed25519 -p "$DEPLOY_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes
            -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=10
            -o ServerAliveCountMax=3 -o ControlMaster=auto
            -o "ControlPath=$RUNNER_TEMP/vpn-bot-ssh-%C" -o ControlPersist=120)
          for attempt in 1 2 3; do
            if ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && chmod 750 deploy/update.sh deploy/rollback.sh deploy/backup-postgres.sh deploy/restore-rehearsal.sh deploy/apply-runtime-settings.sh && VPN_BOT_RELEASE='$RELEASE_SHA' deploy/update.sh"; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] || sleep "$((attempt * 5))"
          done
          exit 1
