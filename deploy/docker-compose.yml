name: vector

x-app: &app
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgres://vpn_bot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vpn_bot
  APPLICATION_ENCRYPTION_KEY: ${APPLICATION_ENCRYPTION_KEY:?set APPLICATION_ENCRYPTION_KEY in .env}

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: vpn_bot
      POSTGRES_USER: vpn_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_bot -d vpn_bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *app

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *app

  api:
    image: ghcr.io/zeragorn-ru/vpn-bot-v2-vpn-api:${VPN_BOT_RELEASE:?set VPN_BOT_RELEASE to a release SHA}
    environment:
      <<: *runtime-environment
      REDIS_URL: redis://redis:6379
      BOOTSTRAP_DIR: /var/lib/vpn/bootstrap
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../data/bootstrap:/var/lib/vpn/bootstrap
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    <<: *app

  telegram-bot:
    profiles: ["telegram"]
    image: ghcr.io/zeragorn-ru/vpn-bot-v2-vpn-telegram-bot:${VPN_BOT_RELEASE:?set VPN_BOT_RELEASE to a release SHA}
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    <<: *app

  billing-worker:
    image: ghcr.io/zeragorn-ru/vpn-bot-v2-vpn-billing-worker:${VPN_BOT_RELEASE:?set VPN_BOT_RELEASE to a release SHA}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app

  provisioning-worker:
    image: ghcr.io/zeragorn-ru/vpn-bot-v2-vpn-provisioning-worker:${VPN_BOT_RELEASE:?set VPN_BOT_RELEASE to a release SHA}
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app

  notification-worker:
    image: ghcr.io/zeragorn-ru/vpn-bot-v2-vpn-notification-worker:${VPN_BOT_RELEASE:?set VPN_BOT_RELEASE to a release SHA}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app

  admin-web:
    image: ghcr.io/zeragorn-ru/vpn-bot-v2-admin-web:${VPN_BOT_RELEASE:?set VPN_BOT_RELEASE to a release SHA}
    ports:
      - "127.0.0.1:18082:80"
    depends_on:
      api:
        condition: service_healthy
    <<: *app

  mini-app-web:
    image: ghcr.io/zeragorn-ru/vpn-bot-v2-mini-app-web:${VPN_BOT_RELEASE:?set VPN_BOT_RELEASE to a release SHA}
    ports:
      - "127.0.0.1:18081:80"
    depends_on:
      api:
        condition: service_healthy
    <<: *app
