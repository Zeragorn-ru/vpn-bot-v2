# Test preview host. Install on the VPS after backing up the active nginx config.
# Certificate paths are created by certbot for test.zeragorn.xyz.

server {
    listen 80;
    listen [::]:80;
    server_name test.zeragorn.xyz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.zeragorn.xyz;

    ssl_certificate /etc/letsencrypt/live/test.zeragorn.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.zeragorn.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
