services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vpn_bot
      POSTGRES_USER: vpn_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_bot -d vpn_bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        BINARY: vpn-api
    env_file: ${ENV_FILE:-.env}
    ports:
      - "0.0.0.0:${API_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      args:
        BINARY: vpn-telegram-bot
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  billing-worker:
    build:
      context: .
      args:
        BINARY: vpn-billing-worker
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  provisioning-worker:
    build:
      context: .
      args:
        BINARY: vpn-provisioning-worker
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      args:
        BINARY: vpn-notification-worker
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mini-app-web:
    build:
      context: ./web/mini-app
    ports:
      - "0.0.0.0:${MINI_APP_HOST_PORT:-18081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ./web/admin
    ports:
      - "0.0.0.0:${ADMIN_WEB_HOST_PORT:-18082}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
